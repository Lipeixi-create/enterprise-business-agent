name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install "opentelemetry-sdk>=1.25,<2.0" "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0"

      - name: Run offline test suite
        run: pytest -q

      - name: Import application
        run: PYTHONPATH=src python -c "from enterprise_business_agent.api.app import app; print(app.title)"
